name: stargazer_journal
description: "Stargazer Journal - A star observation journal built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  go_router: ^14.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # No bundled image assets are required: celestial objects are rendered
  # with vector icons and gradients (see widgets/star_card.dart), so the
  # app has no external asset dependency out of the box.
  # If you add photos later, declare them here, e.g.:
  # assets:
  #   - assets/images/
